name: Feature request
description: Suggest a regulatory, methodological or technical enhancement.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the banking or analytical need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the expected API, data-contract or methodological behaviour.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Regulatory sources
      description: Link to official sources where the request depends on regulation.
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Data protection
      options:
        - label: I confirm that this request contains no personal, confidential or bank-sensitive data.
          required: true
